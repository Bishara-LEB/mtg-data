name: Update MTG data

on:
  schedule:
    - cron: "17 16 * * *"   # once a day (about 3am Sydney)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # only needed to publish the release in this repository

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download card data, rulings, rules and prices
        run: python scripts/fetch.py out
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --title "MTG data $(date -u +%Y-%m-%d)" --notes-file out/manifest.json --latest
