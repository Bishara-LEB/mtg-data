name: Update MTG data

on:
  schedule:
    - cron: "17 16 * * *"   # once a day (about 3am Sydney)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # only needed to publish the release in this repository

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Download card data, rulings, rules and prices
        id: fetch
        continue-on-error: true
        run: python3 scripts/fetch.py out
      - name: Publish as the "latest" release (publishes whatever succeeded; manifest.json lists any errors)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/* --title "MTG data $(date -u +%Y-%m-%d)" --notes-file out/manifest.json --latest
      - name: Fail the run if any source failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
